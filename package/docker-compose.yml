services:
  web:
    image: ghcr.io/noorelahmanifestofinal/livingpanda-pi-solohost-probe:0.4.0
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m
    volumes:
      - operator-data:/data
volumes:
  operator-data:
