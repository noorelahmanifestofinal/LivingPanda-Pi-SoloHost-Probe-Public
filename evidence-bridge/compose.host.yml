name: livingpanda-pi-evidence-bridge

services:
  evidence-bridge:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m
    environment:
      PC_INTELLIGENCE_DB: /pc-intelligence/pc-intelligence.duckdb
      CLOUD_DEVICE_LOG_DIR: /cloud-device-logs
    volumes:
      - "${LIVINGPANDA_DATA_DIR:-D:/LivingPanda-Data}/PC-Intelligence:/pc-intelligence:ro"
      - "${LOCALAPPDATA}/LivingPanda/CloudDevice/logs:/cloud-device-logs:ro"
