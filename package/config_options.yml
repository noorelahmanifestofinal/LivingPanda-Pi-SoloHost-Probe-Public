title: LivingPanda Pi Utility
eyebrow: LivingPanda + Pi
description: Incident Intelligence that correlates Pi and LivingPanda health changes into timed incidents with automatic recovery summaries and adaptive worker-latency baselines.
footer_hint: Telemetry and incident history stay local in an app-owned Docker volume. No host mounts, Docker socket, secrets, or Commander control.
output_file: .env
after_save: >
  Configuration saved. Start the app to begin local read-only incident monitoring.
